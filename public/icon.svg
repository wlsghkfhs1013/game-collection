<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Controller Frame -->
  <g filter="url(#glow)">
    <path d="M140 180 C90 180 60 220 70 290 C78 340 110 380 150 370 C180 362 200 320 220 320 L292 320 C312 320 332 362 362 370 C402 380 434 340 442 290 C452 220 422 180 372 180 Z" fill="#0f172a" stroke="#4338ca" stroke-width="8"/>
  </g>

  <!-- D-Pad (Left) -->
  <g fill="#334155">
    <rect x="135" y="225" width="26" height="70" rx="6" />
    <rect x="113" y="247" width="70" height="26" rx="6" />
    <circle cx="148" cy="260" r="6" fill="#1e293b"/>
  </g>

  <!-- Action Buttons (Right) -->
  <circle cx="340" cy="275" r="13" fill="#ec4899" />
  <circle cx="370" cy="245" r="13" fill="#3b82f6" />
  <circle cx="400" cy="275" r="13" fill="#10b981" />
  <circle cx="370" cy="305" r="13" fill="#f59e0b" />

  <!-- Center Screen / Arcade Neon Badge -->
  <rect x="226" y="235" width="60" height="40" rx="8" fill="#1e1b4b" stroke="url(#accentGrad)" stroke-width="3"/>
  <polygon points="250,247 266,255 250,263" fill="#38bdf8"/>
  
  <!-- Subtle Grips Accent -->
  <path d="M95 280 C98 310 115 330 130 335" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M417 280 C414 310 397 330 382 335" stroke="#ec4899" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
